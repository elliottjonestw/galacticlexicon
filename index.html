<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星際大典 - 星際大戰英漢字典</title>
  <style>
    :root {
      --gold: #a07800;
      --gold-dim: #c99a00;
      --bg: #f2f3f5;
      --surface: #ffffff;
      --border: #dde0e6;
      --text: #1a1c22;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.75rem 1.25rem 1.5rem;
      text-align: center;
    }

    .header-sub {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Search bar ── */
    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(242, 243, 245, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
    }

    .search-inner {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search::placeholder { color: var(--text-muted); }

    #search:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(160, 120, 0, 0.12);
    }

    /* ── Main layout ── */
    main {
      max-width: calc(720px + 2 * 1.25rem);
      margin: 0 auto;
      padding: 1.25rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    #result-count { font-weight: 600; }

    /* ── Cards ── */
    #results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: var(--gold-dim);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card-en {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.3;
    }

    .card-zh {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 0.25rem;
      line-height: 1.3;
    }

    .card-source {
      margin-top: 0.65rem;
      font-size: 0.77rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .source-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold-dim);
      flex-shrink: 0;
    }

    /* ── Highlight ── */
    mark {
      background: rgba(160, 120, 0, 0.15);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .empty .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty p { font-size: 1rem; }

    /* ── Mobile tweaks ── */
    @media (max-width: 480px) {
      header { padding: 1.25rem 1rem 1rem; }
      header h1 { font-size: 2rem; }
      .header-sub { font-size: 1rem; }
      main { padding: 1rem; }
      #results { gap: 0.75rem; }
      .card-en { font-size: 0.95rem; }
      .card-zh { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>星際大典</h1>
  <p class="header-sub">星際大戰英漢字典</p>
</header>

<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input
      id="search"
      type="search"
      placeholder="搜尋英文或中文…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />
  </div>
</div>

<main>
  <div class="meta-row">
    <span id="result-count"></span>
  </div>
  <div id="results"></div>
</main>

<script>
let DATA = [];

fetch('dictionary.csv')
  .then(r => r.text())
  .then(text => {
    DATA = text.trim().split('\n').slice(1).map(line => {
      const cols = line.split(',');
      const ts = cols[cols.length - 1].trim();
      const movie = cols[cols.length - 2].trim();
      const en = cols[0].trim();
      const zh = cols.slice(1, cols.length - 2).join(',').trim();
      return [en, zh, movie, ts];
    });
    for (let i = DATA.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [DATA[i], DATA[j]] = [DATA[j], DATA[i]];
    }
    render();
  });

function norm(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const normText = norm(text);
  const normQuery = norm(query);
  if (!normQuery) return escHtml(text);
  let result = "";
  let i = 0;
  while (i < text.length) {
    const slice = normText.slice(i, i + normQuery.length);
    if (slice === normQuery) {
      result += "<mark>" + escHtml(text.slice(i, i + normQuery.length)) + "</mark>";
      i += normQuery.length;
    } else {
      result += escHtml(text[i]);
      i++;
    }
  }
  return result;
}

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
const countEl = document.getElementById("result-count");

function score(en, zh, raw) {
  const q = norm(raw);
  const normEn = norm(en);
  let enScore = Infinity;
  if (normEn === q) enScore = 0;
  else if (normEn.startsWith(q)) enScore = 1;
  else if (normEn.split(/[\s\-()]+/).some(w => w.startsWith(q))) enScore = 2;
  else if (normEn.includes(q)) enScore = 3;
  let zhScore = Infinity;
  if (zh === raw) zhScore = 0;
  else if (zh.startsWith(raw)) zhScore = 1;
  else if (zh.includes(raw)) zhScore = 2;
  return Math.min(enScore, zhScore);
}

function render() {
  const raw = searchEl.value.trim();
  const q = norm(raw);

  let filtered = DATA.filter(([en, zh]) => {
    if (!q) return true;
    if (zh.includes(raw)) return true;
    if (norm(en).includes(q)) return true;
    return false;
  });

  if (q) {
    filtered.sort((a, b) => score(a[0], a[1], raw) - score(b[0], b[1], raw));
  }

  countEl.textContent = filtered.length === DATA.length
    ? `共 ${DATA.length} 筆`
    : `${DATA.length} 筆中的 ${filtered.length} 筆`;

  if (filtered.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔭</div>
        <p>No results found. Try a different search.</p>
      </div>`;
    return;
  }

  resultsEl.innerHTML = filtered.map(([en, zh, movie, ts]) => {
    const enHl = highlight(en, raw);
    const zhHl = zh.includes(raw) ? highlight(zh, raw) : escHtml(zh);
    return `
      <div class="card">
        <div class="card-en">${enHl}</div>
        <div class="card-zh">${zhHl}</div>
        <div class="card-source">
          <span>翻譯來源：${escHtml(movie)} @ ${escHtml(ts)}</span>
        </div>
      </div>`;
  }).join("");
}

searchEl.addEventListener("input", render);
</script>
</body>
</html>
